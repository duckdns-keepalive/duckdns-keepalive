name: duckdns-keepalive

on:
  schedule:
    - cron: '23 3 */7 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update DuckDNS A record
        env:
          DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          resp=$(curl -fsS --retry 3 \
            "https://www.duckdns.org/update?domains=${DOMAIN}&token=${TOKEN}&ip=100.96.0.1&verbose=true")
          echo "$resp"
          echo "$resp" | grep -q '^OK' || { echo "::error::duckdns update failed"; exit 1; }
